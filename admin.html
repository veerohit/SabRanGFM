<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SabRanGFM Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  background:
    radial-gradient(circle at 50% 0%,#39214d,transparent 45%),
    #090711;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:650px;
  margin:auto;
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#ff9848;
}

.subtitle{
  color:#88818f;
  margin-top:5px;
  margin-bottom:22px;
}

.card{
  background:#15111d;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}

h2,h3{
  margin-top:0;
}

label{
  display:block;
  color:#aaa3b1;
  font-size:13px;
  margin:14px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:11px;
  border:1px solid #302936;
  background:#0b0810;
  color:#fff;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#ff9848;
}

button{
  border:0;
  cursor:pointer;
}

.primary{
  width:100%;
  margin-top:16px;
  padding:14px;
  border-radius:11px;
  background:#ff9848;
  color:#170b03;
  font-weight:700;
  font-size:14px;
}

.primary:disabled{
  opacity:.5;
}

.message{
  min-height:18px;
  margin-top:10px;
  color:#ffb47c;
  font-size:13px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logout{
  padding:10px 14px;
  border-radius:10px;
  background:#292430;
  color:#fff;
}

.playlist{
  padding:15px;
  margin-top:10px;
  border-radius:14px;
  background:#0d0a12;
  border:1px solid rgba(255,255,255,.07);
}

.playlist-name{
  font-size:16px;
  font-weight:700;
}

.playlist-id{
  margin-top:6px;
  color:#77717e;
  font-size:10px;
  word-break:break-all;
}

.status{
  display:inline-block;
  margin-top:9px;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
}

.active{
  background:rgba(50,180,90,.14);
  color:#75f5a2;
}

.inactive{
  background:rgba(220,60,60,.14);
  color:#ff8888;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.actions button{
  flex:1;
  padding:10px 5px;
  border-radius:9px;
  background:#292430;
  color:#fff;
  font-size:12px;
}

.actions .delete{
  background:#762832;
}

.actions .toggle{
  background:#245d3d;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px 5px;
  font-size:13px;
}

#admin-panel{
  display:none;
}

.count{
  color:#777;
  font-size:12px;
  font-weight:normal;
}

@media(max-width:400px){
  body{
    padding:13px;
  }

  .actions{
    flex-wrap:wrap;
  }

  .actions button{
    min-width:30%;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="login-box" class="card">

  <div class="logo">
    Sab<span>RanG</span>FM
  </div>

  <div class="subtitle">
    🔐 Admin Panel
  </div>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button
    id="login-btn"
    class="primary"
  >
    Login
  </button>

  <div
    id="login-message"
    class="message"
  ></div>

</div>


<!-- ADMIN PANEL -->

<div id="admin-panel">

  <div class="topbar">

    <div>
      <div class="logo">
        Sab<span>RanG</span>FM
      </div>

      <div class="subtitle">
        Playlist Dashboard
      </div>
    </div>

    <button
      id="logout"
      class="logout"
    >
      Logout
    </button>

  </div>


  <!-- ADD PLAYLIST -->

  <div class="card">

    <h3>➕ Add Playlist</h3>

    <label>Playlist Name</label>

    <input
      id="playlist-name"
      type="text"
      placeholder="Bhojpuri"
    >

    <label>YouTube Playlist Link</label>

    <input
      id="playlist-url"
      type="text"
      placeholder="https://youtube.com/playlist?list=..."
    >

    <button
      id="add-btn"
      class="primary"
    >
      Add Playlist
    </button>

    <div
      id="add-message"
      class="message"
    ></div>

  </div>


  <!-- PLAYLIST LIST -->

  <div class="card">

    <h3>
      🎵 Playlists
      <span
        id="count"
        class="count"
      ></span>
    </h3>

    <div id="playlist-list">
      Loading...
    </div>

  </div>

</div>

</div>


<script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAJ54NcvxLHptEv6TAAfjAgZokaQ_rx5XE",

  authDomain:
    "veerohit.firebaseapp.com",

  projectId:
    "veerohit",

  storageBucket:
    "veerohit.firebasestorage.app",

  messagingSenderId:
    "350799965318",

  appId:
    "1:350799965318:web:20d8c051d41b635aa2f507",

  measurementId:
    "G-SL83DC74GP"

};


/* =========================================
   INITIALIZE
========================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================
   YOUR ADMIN UID
========================================= */

const ADMIN_UID =
  "L27D01BECSX2W3bENnaKh4wzYHx1";


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
  document.getElementById("login-box");

const adminPanel =
  document.getElementById("admin-panel");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("login-btn");

const loginMessage =
  document.getElementById("login-message");

const logoutBtn =
  document.getElementById("logout");

const nameInput =
  document.getElementById("playlist-name");

const urlInput =
  document.getElementById("playlist-url");

const addBtn =
  document.getElementById("add-btn");

const addMessage =
  document.getElementById("add-message");

const playlistList =
  document.getElementById("playlist-list");

const count =
  document.getElementById("count");


/* =========================================
   LOGIN
========================================= */

loginBtn.onclick =
async function(){

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if(!email || !password){

    loginMessage.textContent =
      "Email aur password enter karo.";

    return;
  }


  loginBtn.disabled =
    true;

  loginMessage.textContent =
    "Login ho raha hai...";


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }
  catch(error){

    console.error(error);

    loginMessage.textContent =
      "Login failed. Email ya password check karo.";

    loginBtn.disabled =
      false;

  }

};


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  function(user){

    if(!user){

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";

      loginBtn.disabled =
        false;

      return;
    }


    /* Only your UID */

    if(
      user.uid !== ADMIN_UID
    ){

      signOut(auth);

      loginMessage.textContent =
        "Ye account admin nahi hai.";

      return;
    }


    loginBox.style.display =
      "none";

    adminPanel.style.display =
      "block";


    loadPlaylists();

  }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.onclick =
async function(){

  await signOut(auth);

};


/* =========================================
   EXTRACT PLAYLIST ID
========================================= */

function getPlaylistId(value){

  value =
    value.trim();


  if(!value){
    return null;
  }


  /*
    Direct playlist ID
  */

  if(
    value.startsWith("PL") &&
    !value.includes("/")
  ){

    return value;

  }


  /*
    YouTube URL
  */

  try{

    const url =
      new URL(value);

    return (
      url.searchParams.get("list")
      || null
    );

  }
  catch(error){

    return null;

  }

}


/* =========================================
   ADD PLAYLIST
========================================= */

addBtn.onclick =
async function(){

  const name =
    nameInput.value.trim();

  const url =
    urlInput.value.trim();


  if(!name){

    addMessage.textContent =
      "Playlist name enter karo.";

    return;
  }


  const youtubeId =
    getPlaylistId(url);


  if(!youtubeId){

    addMessage.textContent =
      "Valid YouTube playlist link dalo.";

    return;
  }


  addBtn.disabled =
    true;

  addMessage.textContent =
    "Playlist save ho rahi hai...";


  try{

    await addDoc(
      collection(
        db,
        "playlists"
      ),
      {

        name:name,

        youtubeId:youtubeId,

        active:true

      }
    );


    nameInput.value =
      "";

    urlInput.value =
      "";


    addMessage.textContent =
      "Playlist added successfully ✅";


    await loadPlaylists();

  }
  catch(error){

    console.error(error);

    addMessage.textContent =
      "Playlist save nahi hui.";

  }


  addBtn.disabled =
    false;

};


/* =========================================
   LOAD PLAYLISTS
========================================= */

async function loadPlaylists(){

  playlistList.innerHTML =
    "<div class='empty'>Loading...</div>";


  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "playlists"
        )
      );


    playlistList.innerHTML =
      "";

    count.textContent =
      "(" + snapshot.size + ")";


    if(snapshot.empty){

      playlistList.innerHTML =
        "<div class='empty'>No playlists found.</div>";

      return;

    }


    snapshot.forEach(
      item => {

        createPlaylistCard(
          item.id,
          item.data()
        );

      }
    );

  }
  catch(error){

    console.error(error);

    playlistList.innerHTML =
      "<div class='empty'>Playlists load nahi ho paayi.</div>";

  }

}


/* =========================================
   CREATE PLAYLIST CARD
========================================= */

function createPlaylistCard(
  id,
  data
){

  const card =
    document.createElement("div");

  card.className =
    "playlist";


  const name =
    document.createElement("div");

  name.className =
    "playlist-name";

  name.textContent =
    data.name || "Unnamed";


  const youtubeId =
    document.createElement("div");

  youtubeId.className =
    "playlist-id";

  youtubeId.textContent =
    data.youtubeId || "";


  const status =
    document.createElement("div");

  status.className =
    "status " +
    (
      data.active
        ? "active"
        : "inactive"
    );

  status.textContent =
    data.active
      ? "🟢 Active"
      : "🔴 Inactive";


  /* ACTIONS */

  const actions =
    document.createElement("div");

  actions.className =
    "actions";


  /* TOGGLE */

  const toggle =
    document.createElement("button");

  toggle.className =
    "toggle";

  toggle.textContent =
    data.active
      ? "🔴 Disable"
      : "🟢 Activate";


  toggle.onclick =
  async function(){

    try{

      await updateDoc(
        doc(
          db,
          "playlists",
          id
        ),
        {

          active:
            !data.active

        }
      );


      loadPlaylists();

    }
    catch(error){

      console.error(error);

      alert(
        "Status change nahi hua."
      );

    }

  };


  /* EDIT */

  const edit =
    document.createElement("button");

  edit.textContent =
    "✏️ Edit";


  edit.onclick =
  async function(){

    const newName =
      prompt(
        "Playlist name:",
        data.name || ""
      );


    if(newName === null){
      return;
    }


    const newUrl =
      prompt(
        "YouTube playlist link / ID:",
        data.youtubeId || ""
      );


    if(newUrl === null){
      return;
    }


    const newId =
      getPlaylistId(
        newUrl
      );


    if(!newId){

      alert(
        "Valid YouTube playlist link dalo."
      );

      return;

    }


    try{

      await updateDoc(
        doc(
          db,
          "playlists",
          id
        ),
        {

          name:
            newName.trim(),

          youtubeId:
            newId

        }
      );


      loadPlaylists();

    }
    catch(error){

      console.error(error);

      alert(
        "Playlist update nahi hui."
      );

    }

  };


  /* DELETE */

  const remove =
    document.createElement("button");

  remove.className =
    "delete";

  remove.textContent =
    "🗑️ Delete";


  remove.onclick =
  async function(){

    const yes =
      confirm(
        "Kya '" +
        (data.name || "playlist") +
        "' delete karni hai?"
      );


    if(!yes){
      return;
    }


    try{

      await deleteDoc(
        doc(
          db,
          "playlists",
          id
        )
      );


      loadPlaylists();

    }
    catch(error){

      console.error(error);

      alert(
        "Playlist delete nahi hui."
      );

    }

  };


  actions.appendChild(
    toggle
  );

  actions.appendChild(
    edit
  );

  actions.appendChild(
    remove
  );


  card.appendChild(
    name
  );

  card.appendChild(
    youtubeId
  );

  card.appendChild(
    status
  );

  card.appendChild(
    actions
  );


  playlistList.appendChild(
    card
  );

}

</script>

</body>
</html>
