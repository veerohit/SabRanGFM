<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SabRanGFM Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 0%,#342044 0%,transparent 42%),
    #090711;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#ff9848;
}

.subtitle{
  color:#898391;
  margin-top:5px;
  margin-bottom:22px;
}

.card{
  background:rgba(21,17,28,.94);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}

h2,h3{
  margin-top:0;
}

label{
  display:block;
  color:#aaa3b1;
  font-size:13px;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #302936;
  background:#0c0911;
  color:#fff;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#ff9848;
}

button{
  border:0;
  cursor:pointer;
  font-weight:600;
}

.primary{
  width:100%;
  padding:14px;
  margin-top:16px;
  border-radius:12px;
  background:#ff9848;
  color:#160b03;
  font-size:14px;
}

.primary:disabled{
  opacity:.5;
}

.message{
  min-height:18px;
  margin-top:11px;
  font-size:13px;
  color:#ffb47c;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.logout{
  padding:10px 14px;
  border-radius:10px;
  background:#292430;
  color:#fff;
}

.playlist{
  padding:15px;
  border-radius:15px;
  background:#0d0a12;
  border:1px solid rgba(255,255,255,.07);
  margin-top:10px;
}

.playlist-head{
  display:flex;
  align-items:center;
  gap:12px;
}

.playlist-icon{
  width:45px;
  height:45px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#ff9848,#7133b1);
  font-size:21px;
}

.playlist-info{
  min-width:0;
  flex:1;
}

.playlist-name{
  font-size:15px;
  font-weight:700;
  word-break:break-word;
}

.playlist-id{
  color:#77717e;
  font-size:10px;
  margin-top:5px;
  word-break:break-all;
}

.status{
  display:inline-block;
  margin-top:10px;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
}

.status.active{
  color:#7dffad;
  background:rgba(54,180,98,.13);
}

.status.inactive{
  color:#ff8d8d;
  background:rgba(220,60,60,.12);
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:13px;
}

.action{
  padding:10px 5px;
  border-radius:9px;
  background:#292430;
  color:#fff;
  font-size:12px;
}

.action.active-btn{
  background:#245d3d;
}

.action.delete{
  background:#742832;
}

.empty{
  padding:25px 5px;
  text-align:center;
  color:#777;
  font-size:13px;
}

#admin-panel{
  display:none;
}

#login-box{
  max-width:430px;
  margin:60px auto;
}

.count{
  color:#777;
  font-size:12px;
  font-weight:normal;
}

.edit-box{
  display:none;
  margin-top:13px;
  padding-top:13px;
  border-top:1px solid rgba(255,255,255,.08);
}

.edit-box.show{
  display:block;
}

.edit-actions{
  display:flex;
  gap:8px;
}

.edit-actions button{
  flex:1;
  padding:11px;
  border-radius:9px;
}

.save-edit{
  background:#ff9848;
  color:#160b03;
}

.cancel-edit{
  background:#292430;
  color:#fff;
}

.refresh{
  padding:9px 12px;
  border-radius:9px;
  background:#292430;
  color:#fff;
}

.list-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}

@media(max-width:420px){
  body{padding:14px}

  .actions{
    grid-template-columns:1fr 1fr;
  }

  .actions .delete{
    grid-column:1/-1;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="login-box" class="card">

  <div class="logo">
    Sab<span>RanG</span>FM
  </div>

  <div class="subtitle">
    🔐 Admin Panel
  </div>

  <label>Email</label>

  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Password"
  >

  <button id="login-btn" class="primary">
    Login
  </button>

  <div id="login-message" class="message"></div>

</div>


<!-- ================= ADMIN ================= -->

<div id="admin-panel">

  <div class="topbar">

    <div>
      <div class="logo">
        Sab<span>RanG</span>FM
      </div>

      <div class="subtitle">
        Playlist Dashboard
      </div>
    </div>

    <button id="logout" class="logout">
      Logout
    </button>

  </div>


  <!-- ADD -->

  <div class="card">

    <h3>➕ Add Playlist</h3>

    <label>Playlist Name</label>

    <input
      id="playlist-name"
      placeholder="Example: Bollywood"
    >

    <label>YouTube Playlist Link / ID</label>

    <input
      id="playlist-url"
      placeholder="https://youtube.com/playlist?list=..."
    >

    <button id="save-btn" class="primary">
      Add Playlist
    </button>

    <div id="save-message" class="message"></div>

  </div>


  <!-- LIST -->

  <div class="card">

    <div class="list-head">

      <h3 style="margin:0">
        🎵 Playlists
        <span id="playlist-count" class="count"></span>
      </h3>

      <button id="refresh" class="refresh">
        🔄
      </button>

    </div>

    <div id="playlist-list">
      Loading...
    </div>

  </div>

</div>

</div>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAJ54NcvxLHptEv6TAAfjAgZokaQ_rx5XE",

  authDomain:
    "veerohit.firebaseapp.com",

  projectId:
    "veerohit",

  storageBucket:
    "veerohit.firebasestorage.app",

  messagingSenderId:
    "350799965318",

  appId:
    "1:350799965318:web:20d8c051d41b635aa2f507",

  measurementId:
    "G-SL83DC74GP"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UID =
  "L27D01BECSX2W3bENnaKh4wzYHx1";


/* =========================================
   ELEMENTS
========================================= */

const loginBox =
  document.getElementById("login-box");

const adminPanel =
  document.getElementById("admin-panel");

const loginBtn =
  document.getElementById("login-btn");

const logoutBtn =
  document.getElementById("logout");

const loginMessage =
  document.getElementById("login-message");

const saveBtn =
  document.getElementById("save-btn");

const saveMessage =
  document.getElementById("save-message");

const playlistList =
  document.getElementById("playlist-list");

const playlistCount =
  document.getElementById("playlist-count");

const refreshBtn =
  document.getElementById("refresh");


/* =========================================
   LOGIN
========================================= */

loginBtn.onclick =
  async function(){

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if(
      !email ||
      !password
    ){

      loginMessage.textContent =
        "Email aur password enter karo.";

      return;
    }


    loginBtn.disabled =
      true;

    loginMessage.textContent =
      "Login ho raha hai...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

    catch(error){

      console.error(error);

      loginMessage.textContent =
        "Login failed. Email/password check karo.";

      loginBtn.disabled =
        false;

    }

  };


/* =========================================
   ENTER KEY LOGIN
========================================= */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        loginBtn.click();

      }

    }
  );


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  function(user){

    if(!user){

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";

      loginBtn.disabled =
        false;

      return;

    }


    if(
      user.uid !== ADMIN_UID
    ){

      signOut(auth);

      loginMessage.textContent =
        "Ye account admin nahi hai.";

      return;

    }


    loginBox.style.display =
      "none";

    adminPanel.style.display =
      "block";


    loadPlaylists();

  }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.onclick =
  async function(){

    await signOut(auth);

  };


/* =========================================
   EXTRACT PLAYLIST ID
========================================= */

function extractPlaylistId(
  value
){

  value =
    value.trim();


  if(!value){
    return null;
  }


  /*
    Direct playlist ID
  */

  if(
    value.startsWith("PL") &&
    !value.includes("/") &&
    !value.includes("?")
  ){

    return value;

  }


  /*
    YouTube URL
  */

  try{

    const url =
      new URL(value);


    const id =
      url.searchParams.get(
        "list"
      );


    if(id){
      return id;
    }


  }

  catch(error){

    return null;

  }


  return null;

}


/* =========================================
   ADD PLAYLIST
========================================= */

saveBtn.onclick =
  async function(){

    const name =
      document
        .getElementById("playlist-name")
        .value
        .trim();


    const url =
      document
        .getElementById("playlist-url")
        .value
        .trim();


    if(!name){

      saveMessage.textContent =
        "Playlist name enter karo.";

      return;

    }


    const youtubeId =
      extractPlaylistId(
        url
      );


    if(!youtubeId){

      saveMessage.textContent =
        "Valid YouTube playlist link/ID dalo.";

      return;

    }


    saveBtn.disabled =
      true;

    saveMessage.textContent =
      "Playlist save ho rahi hai...";


    try{

      await addDoc(
        collection(
          db,
          "playlists"
        ),
        {

          name:name,

          youtubeId:youtubeId,

          active:true

        }
      );


      document
        .getElementById("playlist-name")
        .value = "";


      document
        .getElementById("playlist-url")
        .value = "";


      saveMessage.textContent =
        "Playlist successfully added ✅";


      await loadPlaylists();

    }

    catch(error){

      console.error(error);

      saveMessage.textContent =
        "Save failed.";

    }


    saveBtn.disabled =
      false;

  };


/* =========================================
   LOAD PLAYLISTS
========================================= */

async function loadPlaylists(){

  playlistList.innerHTML =
    "<div class='empty'>Loading playlists...</div>";


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "playlists"
        )
      );


    playlistList.innerHTML =
      "";


    playlistCount.textContent =
      "(" + snap.size + ")";


    if(snap.empty){

      playlistList.innerHTML =
        "<div class='empty'>Abhi koi playlist nahi hai.</div>";

      return;

    }


    snap.forEach(
      snapshot => {

        renderPlaylist(
          snapshot.id,
          snapshot.data()
        );

      }
    );

  }

  catch(error){

    console.error(error);

    playlistList.innerHTML =
      "<div class='empty'>Playlists load nahi ho paayi.</div>";

  }

}


/* =========================================
   RENDER PLAYLIST
========================================= */

function renderPlaylist(
  id,
  data
){

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "playlist";


  const head =
    document.createElement(
      "div"
    );

  head.className =
    "playlist-head";


  const icon =
    document.createElement(
      "div"
    );

  icon.className =
    "playlist-icon";

  icon.textContent =
    "♫";


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "playlist-info";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "playlist-name";

  name.textContent =
    data.name ||
    "Unnamed Playlist";


  const pid =
    document.createElement(
      "div"
    );

  pid.className =
    "playlist-id";

  pid.textContent =
    data.youtubeId ||
    "";


  const status =
    document.createElement(
      "div"
    );

  status.className =
    data.active
      ? "status active"
      : "status inactive";

  status.textContent =
    data.active
      ? "🟢 Active"
      : "🔴 Inactive";


  info.appendChild(name);
  info.appendChild(pid);
  info.appendChild(status);


  head.appendChild(icon);
  head.appendChild(info);


  /* =====================================
     ACTION BUTTONS
  ===================================== */

  const actions =
    document.createElement(
      "div"
    );

  actions.className =
    "actions";


  const toggle =
    document.createElement(
      "button"
    );

  toggle.className =
    "action active-btn";

  toggle.textContent =
    data.active
      ? "🔴 Disable"
      : "🟢 Activate";


  toggle.onclick =
    async function(){

      toggle.disabled =
        true;

      try{

        await updateDoc(
          doc(
            db,
            "playlists",
            id
          ),
          {
            active:
              !data.active
          }
        );


        await loadPlaylists();

      }

      catch(error){

        console.error(error);

        alert(
          "Status change nahi hua."
        );

        toggle.disabled =
          false;

      }

    };


  const edit =
    document.createElement(
      "button"
    );

  edit.className =
    "action";

  edit.textContent =
    "✏️ Edit";


  const remove =
    document.createElement(
      "button"
    );

  remove.className =
    "action delete";

  remove.textContent =
    "🗑️ Delete";


  actions.appendChild(toggle);
  actions.appendChild(edit);
  actions.appendChild(remove);


  /* =====================================
     INLINE EDIT BOX
  ===================================== */

  const editBox =
    document.createElement(
      "div"
    );

  editBox.className =
    "edit-box";


  const editName =
    document.createElement(
      "input"
    );

  editName.value =
    data.name || "";

  editName.placeholder =
    "Playlist name";


  const editUrl =
    document.createElement(
      "input"
    );

  editUrl.style.marginTop =
    "9px";

  editUrl.value =
    data.youtubeId || "";

  editUrl.placeholder =
    "YouTube playlist link / ID";


  const editActions =
    document.createElement(
      "div"
    );

  editActions.className =
    "edit-actions";


  const saveEdit =
    document.createElement(
      "button"
    );

  saveEdit.className =
    "save-edit";

  saveEdit.textContent =
    "Save";


  const cancelEdit =
    document.createElement(
      "button"
    );

  cancelEdit.className =
    "cancel-edit";

  cancelEdit.textContent =
    "Cancel";


  editActions.appendChild(
    saveEdit
  );

  editActions.appendChild(
    cancelEdit
  );


  editBox.appendChild(
    editName
  );

  editBox.appendChild(
    editUrl
  );

  editBox.appendChild(
    editActions
  );


  edit.onclick =
    function(){

      editBox.classList.add(
        "show"
      );

      editName.focus();

    };


  cancelEdit.onclick =
    function(){

      editBox.classList.remove(
        "show"
      );

    };


  saveEdit.onclick =
    async function(){

      const newName =
        editName.value.trim();


      const newId =
        extractPlaylistId(
          editUrl.value
        );


      if(!newName){

        alert(
          "Playlist name enter karo."
        );

        return;

      }


      if(!newId){

        alert(
          "Valid YouTube playlist link/ID dalo."
        );

        return;

      }


      saveEdit.disabled =
        true;

      saveEdit.textContent =
        "Saving...";


      try{

        await updateDoc(
          doc(
            db,
            "playlists",
            id
          ),
          {

            name:newName,

            youtubeId:newId

          }
        );


        await loadPlaylists();

      }

      catch(error){

        console.error(error);

        alert(
          "Playlist update nahi hui."
        );

        saveEdit.disabled =
          false;

        saveEdit.textContent =
          "Save";

      }

    };


  /* =====================================
     DELETE
  ===================================== */

  remove.onclick =
    async function(){

      const confirmed =
        confirm(
          "Kya tum '" +
          (data.name || "this playlist") +
          "' ko delete karna chahte ho?"
        );


      if(!confirmed){
        return;
      }


      remove.disabled =
        true;

      remove.textContent =
        "Deleting...";


      try{

        await deleteDoc(
          doc(
            db,
            "playlists",
            id
          )
        );


        await loadPlaylists();

      }

      catch(error){

        console.error(error);

        alert(
          "Playlist delete nahi hui."
        );

        remove.disabled =
          false;

        remove.textContent =
          "🗑️ Delete";

      }

    };


  box.appendChild(head);
  box.appendChild(actions);
  box.appendChild(editBox);


  playlistList.appendChild(
    box
  );

}


/* =========================================
   REFRESH
========================================= */

refreshBtn.onclick =
  function(){

    loadPlaylists();

  };

</script>

</body>
</html>
